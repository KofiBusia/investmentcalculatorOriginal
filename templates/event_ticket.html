<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Your Ticket — {{ event.title }}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{font-family:'Inter',sans-serif;background:#f8fafc;}
  .hero-gradient{background:linear-gradient(135deg,#052e16 0%,#14532d 50%,#166534 100%);}
  .ticket{background:#fff;border-radius:18px;border:2px dashed #bbf7d0;}
</style>
</head>
<body>

<nav class="hero-gradient" style="padding:1rem 1.5rem;">
  <a href="/" style="color:#fff;font-weight:800;font-size:1.1rem;text-decoration:none;">Invest<span style="color:#86efac;">IQ</span> <span style="color:#d1fae5;font-weight:500;font-size:.9rem;">/ YIN</span></a>
</nav>

<section style="max-width:420px;margin:2.5rem auto;padding:0 1.25rem;">
  <div class="text-center mb-4">
    <i class="fas fa-circle-check text-4xl text-green-500 mb-2"></i>
    <h1 class="text-xl font-black text-gray-900">You're Registered!</h1>
  </div>

  <div class="ticket p-6 text-center">
    <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide">Event</p>
    <p class="font-black text-gray-900 text-lg mb-3">{{ event.title }}</p>
    <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide">Attendee</p>
    <p class="font-bold text-gray-800 mb-4">{{ reg.full_name }}</p>
    <img src="/events/ticket/{{ reg.ticket_code }}/qr.png" alt="Ticket QR" class="mx-auto mb-3" width="140" height="140"/>
    <p class="font-mono text-sm font-bold text-green-700">{{ reg.ticket_code }}</p>
    <p class="text-xs text-gray-400 mt-2">Present this code at check-in.</p>
  </div>
</section>

</body>
</html>
