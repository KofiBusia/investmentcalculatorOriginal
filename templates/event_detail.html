<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>{{ event.title }} — YIN Events</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{font-family:'Inter',sans-serif;background:#f8fafc;}
  .hero-gradient{background:linear-gradient(135deg,#052e16 0%,#14532d 50%,#166534 100%);}
  .input-field{width:100%;border:1.5px solid #e2e8f0;border-radius:10px;padding:.7rem 1rem;font-size:.93rem;outline:none;}
  .input-field:focus{border-color:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.1);}
  .submit-btn{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;padding:.9rem 2rem;border-radius:12px;font-weight:800;border:none;cursor:pointer;width:100%;}
</style>
</head>
<body>

<nav class="hero-gradient" style="padding:1rem 1.5rem;">
  <a href="/events" style="color:#fff;font-weight:800;font-size:1.1rem;text-decoration:none;"><i class="fas fa-arrow-left mr-2"></i>All Events</a>
</nav>

<section style="max-width:520px;margin:2.5rem auto;padding:0 1.25rem;">
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-7">
    <h1 class="text-xl font-black text-gray-900 mb-2">{{ event.title }}</h1>
    <p class="text-sm text-gray-500 mb-1"><i class="fas fa-calendar text-green-600 mr-1"></i>{{ event.event_date.strftime('%A, %d %B %Y · %I:%M %p') }}</p>
    {% if event.location %}<p class="text-sm text-gray-500 mb-4"><i class="fas fa-location-dot text-green-600 mr-1"></i>{{ event.location }}</p>{% endif %}
    {% if event.description %}<p class="text-sm text-gray-600 mb-6">{{ event.description }}</p>{% endif %}

    {% if error %}
    <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-xl text-sm">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/events/{{ event.id }}">
      <div class="mb-3">
        <input type="text" name="full_name" required placeholder="Full Name" class="input-field"/>
      </div>
      <div class="mb-3">
        <input type="email" name="email" required placeholder="Email Address" class="input-field"/>
      </div>
      <div class="mb-5">
        <input type="tel" name="phone" placeholder="Phone Number" class="input-field"/>
      </div>
      <button type="submit" class="submit-btn"><i class="fas fa-ticket mr-2"></i>Register for this Event</button>
    </form>
  </div>
</section>

</body>
</html>
