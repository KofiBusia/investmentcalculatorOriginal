<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Partner Login — Young Investors Network</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{font-family:'Inter',sans-serif;background:#f8fafc;}
  .hero-gradient{background:linear-gradient(135deg,#052e16 0%,#14532d 50%,#166534 100%);}
  .input-field{width:100%;border:1.5px solid #e2e8f0;border-radius:10px;padding:.7rem 1rem;font-size:.93rem;outline:none;}
  .input-field:focus{border-color:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.1);}
  .submit-btn{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;padding:.9rem 2rem;border-radius:12px;font-weight:800;border:none;cursor:pointer;width:100%;}
</style>
</head>
<body>

<nav class="hero-gradient" style="padding:1rem 1.5rem;">
  <a href="/" style="color:#fff;font-weight:800;font-size:1.1rem;text-decoration:none;">Invest<span style="color:#86efac;">IQ</span> <span style="color:#d1fae5;font-weight:500;font-size:.9rem;">/ YIN</span></a>
</nav>

<section style="max-width:420px;margin:3rem auto;padding:0 1.25rem;">
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-7">
    <h1 class="text-xl font-black text-gray-900 mb-1"><i class="fas fa-handshake-angle text-green-600 mr-1"></i>Partner Login</h1>
    <p class="text-gray-500 text-sm mb-6">For YIN sponsors and partners to view impact stats.</p>

    {% if error %}<div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-xl text-sm">{{ error }}</div>{% endif %}

    <form method="POST" action="/partner/login">
      <div class="mb-4"><input type="email" name="email" required placeholder="Email" class="input-field"/></div>
      <div class="mb-6"><input type="password" name="password" required placeholder="Password" class="input-field"/></div>
      <button type="submit" class="submit-btn"><i class="fas fa-arrow-right-to-bracket mr-2"></i>Log In</button>
    </form>
  </div>
</section>

</body>
</html>
