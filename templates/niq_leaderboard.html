<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>NIQ Leaderboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{font-family:'Inter',sans-serif;background:#f8fafc;}
  .hero-gradient{background:linear-gradient(135deg,#052e16 0%,#14532d 50%,#166534 100%);}
  .rank-row{border:1px solid #f1f5f9;border-radius:12px;padding:.9rem 1.1rem;display:flex;align-items:center;gap:1rem;background:#fff;}
  .rank-top{background:linear-gradient(135deg,#f0fdf4,#fff);border-color:#bbf7d0;}
  .tab{padding:.5rem 1rem;border-radius:999px;font-size:.85rem;font-weight:700;text-decoration:none;}
  .tab-active{background:#16a34a;color:#fff;}
  .tab-inactive{background:#f1f5f9;color:#64748b;}
</style>
</head>
<body>

<nav class="hero-gradient" style="padding:1rem 1.5rem;">
  <a href="/niq" style="color:#fff;font-weight:800;font-size:1.1rem;text-decoration:none;"><i class="fas fa-arrow-left mr-2"></i>NIQ Home</a>
</nav>

<section style="max-width:560px;margin:2.5rem auto;padding:0 1.25rem;">
  <h1 class="text-2xl font-black text-gray-900 text-center mb-4"><i class="fas fa-trophy text-amber-500 mr-2"></i>NIQ Leaderboard</h1>
  <div class="flex justify-center gap-2 mb-6">
    <a href="/niq/leaderboard?round=qualifying" class="tab {% if round_type=='qualifying' %}tab-active{% else %}tab-inactive{% endif %}">Qualifying</a>
    <a href="/niq/leaderboard?round=final" class="tab {% if round_type=='final' %}tab-active{% else %}tab-inactive{% endif %}">Final</a>
  </div>

  <div class="space-y-2">
    {% for a in top %}
    <div class="rank-row {% if loop.index <= 3 %}rank-top{% endif %}">
      <div class="w-9 h-9 rounded-full flex items-center justify-center font-black text-sm
                  {% if loop.index == 1 %}bg-amber-400 text-white{% elif loop.index == 2 %}bg-gray-300 text-white{% elif loop.index == 3 %}bg-amber-700 text-white{% else %}bg-gray-100 text-gray-500{% endif %}">
        {{ loop.index }}
      </div>
      <div class="flex-1 min-w-0">
        <p class="font-bold text-gray-800 truncate">{{ a.student_name }}</p>
        <p class="text-xs text-gray-400">{{ a.school.name if a.school else '' }}</p>
      </div>
      <p class="font-black text-green-700">{{ a.score }}/{{ a.total_questions }}</p>
    </div>
    {% else %}
    <p class="text-center text-gray-400 py-10">No completed attempts for this round yet.</p>
    {% endfor %}
  </div>
</section>

</body>
</html>
