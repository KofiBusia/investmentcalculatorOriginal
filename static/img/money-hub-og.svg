  <rect x="915" y="190" width="12" height="220" rx="4" fill="#4ade80" opacity="0.5"/>
  <rect x="935" y="215" width="130" height="8" rx="4" fill="#ffffff" opacity="0.25"/>
  <rect x="935" y="235" width="110" height="6" rx="3" fill="#ffffff" opacity="0.15"/>
  <rect x="935" y="250" width="120" height="6" rx="3" fill="#ffffff" opacity="0.15"/>
  <rect x="935" y="265" width="90" height="6" rx="3" fill="#ffffff" opacity="0.15"/>
  <rect x="935" y="290" width="130" height="6" rx="3" fill="#4ade80" opacity="0.3"/>
  <rect x="935" y="306" width="100" height="6" rx="3" fill="#ffffff" opacity="0.15"/>
  <rect x="935" y="321" width="115" height="6" rx="3" fill="#ffffff" opacity="0.15"/>
  <rect x="935" y="336" width="80" height="6" rx="3" fill="#ffffff" opacity="0.15"/>
