  <text x="306" y="512" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#93c5fd" text-anchor="middle" dominant-baseline="middle">50 Questions</text>

  <rect x="408" y="486" width="190" height="42" rx="21" fill="#16a34a" opacity="0.55"/>
